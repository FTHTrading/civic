[package]
name = "mia_via_kernel"
version = "0.1.0"
edition = "2021"
authors = ["UnyKorn LLC <engineering@unykorn.ai>", "FTH Trading"]
description = "MIA by VIA State-Governed Civic Platform Core Kernel — 10 Aggregate State Machines & Hash-Chained Receipts"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "verify-receipts"
path = "src/bin/verify_receipts.rs"

[[bin]]
name = "mia_via_kernel"
path = "src/main.rs"
